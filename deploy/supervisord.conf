
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
command=/app/api
directory=/app
autostart=true
autorestart=true
startretries=5
priority=10
; APP_PORT wins over PORT in the API's config, so pin both: nginx owns 8080.
environment=PORT="8081",APP_PORT="8081",GIN_MODE="release"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nuxt]
command=node /frontend/.output/server/index.mjs
directory=/frontend
autostart=true
autorestart=true
startretries=5
priority=20
environment=NODE_ENV="production",NITRO_HOST="127.0.0.1",NITRO_PORT="3000"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
