services:
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password_change_me
      MYSQL_DATABASE: income_expense
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # API is run from host during development; this service is optional for full-stack later
  # api:
  #   build: .
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   env_file: .env
  #   ports:
  #     - "8080:8080"

volumes:
  mysql_data:
