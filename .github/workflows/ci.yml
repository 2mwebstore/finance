name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: income_expense
          MYSQL_USER: finance
          MYSQL_PASSWORD: finance_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./internal/... -count=1
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: finance
          DB_PASSWORD: finance_test
          DB_NAME: income_expense
      - name: Build
        run: go build -o /tmp/api ./cmd/api
      - name: Integration tests
        run: |
          export APP_ENV=test APP_PORT=8080 TZ=Asia/Phnom_Penh
          export DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=finance DB_PASSWORD=finance_test DB_NAME=income_expense
          export DB_PARAMS='charset=utf8mb4&parseTime=True&loc=Asia%2FPhnom_Penh'
          export JWT_SECRET=ci_jwt_secret_at_least_32_characters_xx
          export SETUP_TOKEN=ci-setup-token
          export CORS_ORIGINS=http://localhost:3000
          /tmp/api &
          sleep 3
          go test -tags=integration ./tests/ -count=1 -v || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: /api/v1
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t finance-api:ci ./backend
